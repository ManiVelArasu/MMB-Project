name: mmb_app
description: "MMB App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  retrofit: ^4.9.0
  http: ^1.5.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  intl: ^0.20.2
  fluttertoast: ^9.0.0
  permission_handler: ^12.0.1
  cached_network_image: ^3.4.1
  dio: ^5.8.0+1
  url_launcher: ^6.3.2
  flutter_otp_text_field: ^1.5.1+1
  image_picker: ^1.2.1
  extended_image: ^9.0.0
  extended_image_library: ^4.0.0
  path_provider: ^2.1.5
  image_background_remover: ^1.0.0
  video_player: ^2.9.2
  lottie: ^3.5.1
  pro_image_editor: ^13.2.3
  emoji_picker_flutter: ^3.0.0
  flutter_colorpicker: ^1.1.0
  dotted_border: ^2.1.0
  pinput: ^6.0.0
  image_cropper: ^12.2.1
  gal: ^2.3.2
  device_info_plus: ^12.2.0
  share_plus: ^12.0.2
  archive: ^4.0.9
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  audioplayers: ^6.8.1
  file_picker: ^11.0.3
  path: ^1.9.0
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.14.1
  razorpay_flutter: ^1.4.7
  image: ^4.5.4
  flutter_tts: ^4.2.3
  pdf: any
  printing: any
  flutter_inappwebview: any
  ffmpeg_kit_flutter_new: ^3.1.0
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  retrofit_generator: ^10.1.2
  build_runner: ^2.10.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-ExtraLight.ttf
          weight: 100
        - asset: assets/fonts/outfit/Outfit-Thin.ttf
          weight: 200
        - asset: assets/fonts/outfit/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/outfit/Outfit-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
